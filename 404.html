<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | The Biz Gift</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/image/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=5">
  <link rel="stylesheet" href="/pages.css?v=10">
  <link rel="preload" href="/header.html" as="fetch" crossorigin>
  <link rel="preload" href="/footer.html" as="fetch" crossorigin>
  <style>
    .error-404 {
      padding: 8rem var(--space-layout);
      text-align: center;
      background-color: var(--bg-ivory);
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .error-404 .eyebrow {
      display: block;
      font-size: var(--font-size-small-button);
      letter-spacing: 0.2em;
      color: var(--accent-bronze);
      margin-bottom: 1.5rem;
    }
    .error-404 h1 {
      font-family: var(--font-serif);
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 500;
      line-height: 1;
      margin: 0;
      color: var(--text-dark);
    }
    .error-404 p {
      font-size: var(--font-size-body);
      color: var(--text-muted);
      font-weight: 300;
      max-width: 44ch;
      margin: 1.5rem 0 2.5rem;
      line-height: 1.7;
    }
    .error-404 .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div id="header-placeholder"></div>

  <main>
    <section class="error-404">
      <span class="eyebrow">The Biz Gift</span>
      <h1>404</h1>
      <p>We couldn't find the page you were looking for. It may have moved, or the link may be out of date.</p>
      <div class="error-actions">
        <a href="/" class="btn-action btn-primary">Back To Home</a>
        <a href="/explore/" class="btn-action btn-secondary">Explore Hampers</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/components.js?v=3"></script>
</body>
